stages:
  ingest:
    cmd: >-
      recsys-ingest
      --reviews data/fixtures/reviews.jsonl
      --products data/fixtures/products.jsonl
      --output artifacts/ingestion
    deps:
      - data/fixtures/reviews.jsonl
      - data/fixtures/products.jsonl
      - src/recsys
    outs:
      - artifacts/ingestion

  split:
    cmd: >-
      recsys-split
      --ingestion artifacts/ingestion
      --output artifacts/splits
      --train-end-ms 1600000500000
      --dev-end-ms 1600001500000
    deps:
      - artifacts/ingestion
      - src/recsys
    outs:
      - artifacts/splits
