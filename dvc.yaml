stages:
  preprocess:
    cmd: >-
      recsys-preprocess
      --reviews data/raw/All_Beauty.jsonl.gz
      --products data/raw/meta_All_Beauty.jsonl.gz
      --output artifacts/real/ingestion
    deps:
      - data/raw/All_Beauty.jsonl.gz
      - data/raw/meta_All_Beauty.jsonl.gz
      - src/recsys/ingest.py
      - src/recsys/preprocess.py
    outs:
      - artifacts/real/ingestion

